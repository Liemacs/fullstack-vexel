services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:80"
    environment:
      APP_NAME: "Vexel API"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/data/database.sqlite
      LOG_CHANNEL: stderr
    volumes:
      - backend-data:/var/data

  web:
    build:
      context: ./web
    ports:
      - "5175:80"
    environment:
      API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  backend-data:
