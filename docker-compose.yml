services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:80"
    environment:
      APP_NAME: "Vexel API"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DATABASE_URL: postgresql://vexel:vexel@db:5432/vexel
      LOG_CHANNEL: stderr
    depends_on:
      - db

  web:
    build:
      context: ./web
    ports:
      - "5175:80"
    environment:
      API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vexel
      POSTGRES_USER: vexel
      POSTGRES_PASSWORD: vexel
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
